<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AttendanceUI</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <!-- Component-scoped styles (*.razor.css, e.g. QR Codes and Audit Log), bundled by the build. -->
    <link rel="stylesheet" href="AttendanceUI.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet class="hidden">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window.__theme = {
            get: function () {
                return localStorage.getItem('theme') || 'light';
            },
            set: function (theme) {
                if (theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
                localStorage.setItem('theme', theme);
            },
            toggle: function () {
                var current = this.get();
                this.set(current === 'dark' ? 'light' : 'dark');
                return this.get();
            },
            init: function () {
                var theme = this.get();
                if (theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            }
        };
        window.__theme.init();
    </script>

    <script>
        window.__dropdownSpaceBelow = function (el) {
            var rect = el.getBoundingClientRect();
            return window.innerHeight - rect.bottom;
        };

        // Cards, cells and thumbnails given role="button"/"option" are pressed with Space by
        // their Blazor keydown handler (KeyActivation); stop Space from also scrolling the page.
        document.addEventListener('keydown', function (e) {
            if (e.key !== ' ' && e.key !== 'Spacebar') return;
            var role = e.target instanceof Element ? e.target.getAttribute('role') : null;
            if ((role === 'button' || role === 'option') && e.target.tagName !== 'BUTTON') {
                e.preventDefault();
            }
        });
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="students.js"></script>
    <script src="rooms.js"></script>
    <script src="js/qrCodes.js"></script>
    <script src="js/html5-qrcode.min.js"></script>
    <script src="js/qrScanner.js"></script>
    <script src="js/chart.umd.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/modal.js"></script>

</body>

</html>
